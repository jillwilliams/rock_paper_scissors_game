<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8" Unicode="U+1F334, UTF-8: F0 9F 8C B4" Unicode= "U+1F332, UTF-8: F0 9F 8C B2" Unicode= "U+00A9"  Unicode="U+00A9, UTF-8: C2 A9" Unicode="U+1F440, UTF-8: F0 9F 91 80">
    <title>Rock, Paper, Scissors</title>
    <link HREF="https://fonts.googleapis.com/css?family=Dancing+Script|Indie+Flower|Shadows+Into+Light|Fresca|Nunito|Yoyu|Iceland|Arial|Yeseva One|Tagesschrift|du+NSW+ACT+Cursive|BenchNine|Birthstone|Jolly Lodger|Quicksand|Raleway" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/9f71dab2a2.js" crossorigin="anonymous"></script>
    <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"/> -->

    <!-- <meta name="keywords" content="”> -->
</head>
<body>
    <div class="container">
        <div class="gameboard">
            <div class="title">
                <h2>Rock, Paper, Scissors Game</h2>
            </div>
            <div class="players-choice">
                <h2>Player's Choice:</h2>
                <div class="images" id="images">
                    <img src="images/rock.jpg" id="rock-img">
                    <img src="images/paper.jpg" id="paper-img">
                    <img src="images/scissors.jpg" id="scissors-img">
                </div>
            </div>
            <div class="computer-choice">
                <h2>Computer's Choice:</h2>
                <div class="computer-choice-image" id="computer-choice-image"></div>
            </div>
            <div class="results" id="results"></div>
            <div class="scores">
                <h2>SCORE</h2>
                <div class="score-results" id="score-results">
                    <h2>Wins: <span id="wins"></span></h2>
                    <h2>Losses: <span id="losses"></span></h2>
                    <h2>Ties: <span id="ties"></span></h2>
                </div>
            </div>
            <div class="buttons">
                <div class="play-again-button" id="play-again-button">
                    Play Again
                </div>
                <div class="quit-button" id="quit-button">
                    Quit
                </div>
            </div>
        </div>
    </div>



    <script src="app.js"></script>
</body>
</html>
